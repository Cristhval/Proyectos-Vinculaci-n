services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: vinculacion
      POSTGRES_USER: vinculacion_user
      POSTGRES_PASSWORD: vinculacion_pass
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  auth:
    build: ./auth_service
    env_file:
      - ./auth_service/.env
    environment:
      - ALLOWED_HOSTS=localhost,127.0.0.1,auth
      - FRONTEND_URL=http://localhost
      - AUTH_SERVICE_URL=http://localhost:8001
    ports:
      - "8001:8001"

  backend:
    build: .
    env_file:
      - ./.env
    environment:
      - DEBUG=False
      - SECRET_KEY=django-insecure-docker-dev-key-change-in-production
      - ALLOWED_HOSTS=localhost,127.0.0.1,backend
      - DATABASE_URL=psql://vinculacion_user:vinculacion_pass@db:5432/vinculacion
      - CORS_ALLOWED_ORIGINS=http://localhost,http://localhost:3000
    depends_on:
      - db
      - auth
    ports:
      - "8000:8000"
    volumes:
      - media_data:/app/media

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  postgres_data:
  media_data:
