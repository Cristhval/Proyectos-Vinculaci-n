services:
  # API principal (proyectos, convenios, seguimiento, reportes...)
  - type: web
    name: vinculacion-api
    env: python
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate
    startCommand: gunicorn proyecto_vinculacion_universidad.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: .onrender.com,localhost
      - key: DATABASE_URL
        fromDatabase:
          name: vinculacion-db
          property: connectionString
      - key: CORS_ALLOWED_ORIGINS
        value: https://tu-frontend.vercel.app
      - key: ANTHROPIC_API_KEY
        sync: false
      # Clave PÚBLICA de auth-service (la misma que JWT_PUBLIC_KEY de vinculacion-auth)
      - key: AUTH_PUBLIC_KEY
        sync: false
      - key: AUTH_ISSUER
        value: vinculacion-auth
      - key: AUTH_AUDIENCE
        value: vinculacion-api

  # Módulo de acceso independiente: login, roles, reCAPTCHA, Google/GitHub/Facebook, recuperación
  - type: web
    name: vinculacion-auth
    env: python
    rootDir: auth_service
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate && python manage.py sembrar_cuentas
    startCommand: gunicorn auth_project.wsgi:application --bind 0.0.0.0:$PORT
    healthCheckPath: /salud/
    envVars:
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: .onrender.com,localhost
      # Render gratis permite UNA base Postgres por workspace: usa una base aparte (p. ej. Neon)
      # o un esquema propio en vinculacion-db. Ver auth_service/README.md, sección "Base de datos".
      - key: DATABASE_URL
        sync: false
      - key: FRONTEND_URL
        value: https://tu-frontend.vercel.app
      - key: AUTH_SERVICE_URL
        value: https://vinculacion-auth.onrender.com
      - key: JWT_PRIVATE_KEY
        sync: false
      - key: JWT_PUBLIC_KEY
        sync: false
      - key: RECAPTCHA_SECRET_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: FACEBOOK_CLIENT_ID
        sync: false
      - key: FACEBOOK_CLIENT_SECRET
        sync: false
      - key: EMAIL_EMISOR
        value: brevo
      - key: BREVO_API_KEY
        sync: false
      - key: EMAIL_REMITENTE
        sync: false
      - key: SEED_ADMIN_EMAIL
        sync: false
      - key: SEED_ADMIN_PASSWORD
        sync: false
      - key: SEED_COORDINADOR_PASSWORD
        sync: false
      - key: SEED_DOCENTE_PASSWORD
        sync: false
      - key: SEED_ESTUDIANTE_PASSWORD
        sync: false

databases:
  - name: vinculacion-db
    plan: free
